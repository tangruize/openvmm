schema_version = 1

[project]
root = "."

[language]
name = "verus"

[targets]
include = ["snapshot.rs"]
visibility = "public"

[build]
adapter = "verus.single_file"
extra_args = ["--edition=2024", "--crate-type=lib"]

[analysis]
kind = "concrete_determinism"
observation_policy = "verus-observable-v1"

[limits]
verifier_timeout_seconds = 30
solver_timeout_ms = 1000
max_search_rounds = 12
seed = 0

[artifacts]
output_dir = ".system-proof/snapshot-restore-open/specdet-results"

[assistance]
mode = "off"
